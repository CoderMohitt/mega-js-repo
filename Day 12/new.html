<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 20px;
        }

        .same {
            background-color: orange;
        }

        #one {
            grid-column-start: 1;
            grid-column-end: 4;
        }

        #two {
            grid-row-start: 2;
            grid-row-end: 4;
        }

        .end {
            grid-column-start: 1;
            grid-column-end: 4;
        }

        .three {
            grid-column-start: 2;
            grid-column-end: 4;
        }
    </style>

</head>
<body>
    <div id="main">
        <div class="same" id="one">1</div>
        <div class="same" id="two">2</div>
        <div class="same three">3</div>
        <div class="same">4</div>
        <div class="same">5</div>
        <div class="same end">6</div>
    </div>
</body>
</html>
